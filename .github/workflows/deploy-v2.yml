name: V2 Portfolio CI/CD

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run lint checks
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --run

      - name: Build V2 frontend
        env:
          VITE_API_BASE_URL: https://totwj54lq4.execute-api.ap-southeast-2.amazonaws.com
        run: npm run build
