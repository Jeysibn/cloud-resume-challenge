name: V2 Portfolio CI/CD

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run lint checks
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --run

      - name: Build V2 frontend
        env:
          VITE_API_BASE_URL: https://kfpwu0cd7k.execute-api.ap-southeast-2.amazonaws.com
        run: npm run build

      - name: Save frontend build
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: v2-frontend
          path: frontend/app/dist/
          if-no-files-found: error
          retention-days: 1

  deploy-v2:
    name: Deploy V2 to AWS
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: v2-frontend
          path: dist

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::665514296439:role/cloud-resume-v2-github-actions-deploy
          aws-region: ap-southeast-2
          allowed-account-ids: "665514296439"

      - name: Verify AWS account
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          test "$ACCOUNT" = "665514296439"

      - name: Upload frontend assets
        run: |
          aws s3 sync dist/ \
            s3://cloud-resume-v2-website-665514296439-ap-southeast-2/ \
            --exclude "index.html"

      - name: Upload index.html last
        run: |
          aws s3 cp dist/index.html \
            s3://cloud-resume-v2-website-665514296439-ap-southeast-2/index.html \
            --content-type "text/html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2558FK1UWYLQG \
            --paths "/*"
