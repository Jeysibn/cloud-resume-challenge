<rect x="64" y="196" width="1472" height="128" class="zone"/><text x="88" y="224" class="tag">01 · AUTHORING / CI</text><rect x="144" y="244" width="200" height="52" rx="4" class="node"/><text x="244" y="276" class="n" font-size="16" font-weight="600" text-anchor="middle">Engineer</text><rect x="512" y="236" width="304" height="68" rx="4" class="node"/><text x="664" y="264" class="n" font-size="17" font-weight="600" text-anchor="middle">homelab-gitops</text><text x="664" y="284" class="m" font-size="11" text-anchor="middle">TERRAFORM · BOOTSTRAP · MANIFESTS</text><rect x="1000" y="236" width="344" height="68" rx="4" class="focal"/><text x="1172" y="264" class="n white" font-size="18" font-weight="600" text-anchor="middle">GitHub Actions</text><text x="1172" y="284" class="m white" font-size="11" text-anchor="middle">YAML · SHELL · HELM · KUBECONFORM</text><path d="M344 270H512" class="line"/><path d="M816 270H1000" class="line"/>
<rect x="64" y="348" width="1472" height="136" class="zone"/><text x="88" y="376" class="tag">02 · INFRASTRUCTURE PROVISIONING</text><rect x="160" y="404" width="208" height="52" rx="4" class="trust"/><text x="264" y="436" class="n" font-size="16" font-weight="600" text-anchor="middle">Tailscale</text><rect x="512" y="396" width="232" height="68" rx="4" class="node"/><text x="628" y="424" class="n" font-size="18" font-weight="600" text-anchor="middle">Terraform</text><text x="628" y="444" class="m" font-size="11" text-anchor="middle">PROXMOX PROVIDER</text><rect x="856" y="396" width="232" height="68" rx="4" class="petrol"/><text x="972" y="424" class="n" font-size="16" font-weight="600" text-anchor="middle">HCP Terraform</text><text x="972" y="444" class="m" font-size="11" text-anchor="middle">REMOTE STATE</text><rect x="1232" y="396" width="232" height="68" rx="4" class="petrol"/><text x="1348" y="424" class="n" font-size="18" font-weight="600" text-anchor="middle">Proxmox VE</text><text x="1348" y="444" class="m" font-size="11" text-anchor="middle">UBUNTU VM + CLOUD-INIT</text><path d="M1172 304V340H264V404" class="line"/><path d="M368 430H512" class="line"/><path d="M744 416H856" class="line dash"/><path d="M744 444H1200V430H1232" class="line"/>
