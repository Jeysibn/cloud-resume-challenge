<title id="homelab-gitops-title">Homelab provisioning and GitOps architecture</title><desc id="homelab-gitops-desc">Four-phase deployment view tracing authoring and validation through Terraform provisioning, host bootstrap, and Argo CD reconciliation from the main branch.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz@6..96&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Manrope:wght@400;600&amp;display=swap');.t{font-family:'Bodoni Moda',serif;fill:#171912}.n{font-family:Manrope,sans-serif;fill:#171912}.m{font-family:'IBM Plex Mono',monospace;fill:#5f625b}.zone{fill:none;stroke:#9b978d}.node{fill:#f8f4eb;stroke:#171912;stroke-width:1.5}.soft{fill:#ded8ca;stroke:#6f7169}.petrol{fill:#d4dfd9;stroke:#275d57;stroke-width:1.5}.focal{fill:#171912;stroke:#e0522d;stroke-width:2}.trust{fill:#f1cfc2;stroke:#e0522d;stroke-width:1.5}.line{fill:none;stroke:#66695f;stroke-width:2;marker-end:url(#a)}.dash{stroke-dasharray:8 8}.tag{font:500 12px 'IBM Plex Mono';fill:#275d57;letter-spacing:2px}.label{font:500 12px 'IBM Plex Mono';fill:#5f625b}.white{fill:#eee9de}</style><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#66695f"/></marker></defs>
