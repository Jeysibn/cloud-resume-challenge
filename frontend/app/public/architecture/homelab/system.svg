<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="homelab-system-title homelab-system-desc">
<title id="homelab-system-title">Homelab system architecture</title><desc id="homelab-system-desc">Deployment view showing a Proxmox host containing one Ubuntu virtual machine and a single-node k3s cluster with entry, workload, storage, and observability services.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz@6..96&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Manrope:wght@400;600&amp;display=swap');.t{font-family:'Bodoni Moda',serif;fill:#171912}.n{font-family:Manrope,sans-serif;fill:#171912}.m{font-family:'IBM Plex Mono',monospace;fill:#5f625b}.zone{fill:none;stroke:#9b978d}.inner{fill:#f2ede3;stroke:#6f7169}.node{fill:#f8f4eb;stroke:#171912;stroke-width:1.5}.petrol{fill:#d4dfd9;stroke:#275d57;stroke-width:1.5}.focal{fill:#171912;stroke:#e0522d;stroke-width:2}.trust{fill:#f1cfc2;stroke:#e0522d;stroke-width:1.5}.line{fill:none;stroke:#66695f;stroke-width:2;marker-end:url(#a)}.dash{stroke-dasharray:8 8}.tag{font:500 12px 'IBM Plex Mono';fill:#275d57;letter-spacing:2px}.label{font:500 12px 'IBM Plex Mono';fill:#5f625b}.white{fill:#eee9de}</style><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#66695f"/></marker></defs>
<rect width="1600" height="900" fill="#eee9de"/><text x="64" y="68" class="tag">SYSTEM 02 · RUNTIME</text><text x="64" y="126" class="t" font-size="48">Single-node homelab topology</text><text x="1536" y="68" class="m" font-size="12" text-anchor="end">C4 · DEPLOYMENT VIEW</text><line x1="64" y1="156" x2="1536" y2="156" stroke="#bbb5aa"/>
<rect x="64" y="212" width="232" height="72" rx="4" class="node"/><text x="180" y="244" class="n" font-size="18" font-weight="600" text-anchor="middle">LAN operator</text><text x="180" y="264" class="m" font-size="12" text-anchor="middle">*.HOMELAB.LOCAL</text>
<rect x="336" y="188" width="1200" height="620" class="zone"/><text x="360" y="216" class="tag">PROXMOX VE · 192.168.86.61</text><rect x="372" y="240" width="1128" height="532" class="inner"/><text x="396" y="268" class="tag">UBUNTU 22.04 VM · K3S-NODE-01 · 4 VCPU · 8 GB</text><rect x="408" y="292" width="1056" height="444" class="zone" stroke="#e0522d"/><text x="432" y="320" class="tag">SINGLE-NODE K3S · CALICO CNI</text>
<rect x="440" y="348" width="992" height="120" class="zone"/><text x="460" y="372" class="tag">NETWORK / ENTRY</text><rect x="472" y="392" width="216" height="52" rx="4" class="petrol"/><text x="580" y="416" class="n" font-size="16" font-weight="600" text-anchor="middle">Pi-hole → Unbound</text><text x="580" y="434" class="m" font-size="12" text-anchor="middle">DNS</text><rect x="760" y="392" width="176" height="52" rx="4" class="petrol"/><text x="848" y="424" class="n" font-size="16" font-weight="600" text-anchor="middle">MetalLB</text><rect x="1008" y="384" width="192" height="68" rx="4" class="focal"/><text x="1104" y="414" class="n white" font-size="18" font-weight="600" text-anchor="middle">Traefik</text><text x="1104" y="434" class="m white" font-size="12" text-anchor="middle">HTTP / HTTPS</text><rect x="1264" y="392" width="136" height="52" rx="4" class="trust"/><text x="1332" y="414" class="n" font-size="14" font-weight="600" text-anchor="middle">cert-manager</text><text x="1332" y="432" class="m" font-size="10" text-anchor="middle">SELF-SIGNED</text>
<path d="M296 248H432V418H472" class="line"/><path d="M688 418H760" class="line"/><path d="M936 418H1008" class="line"/><path d="M1264 418H1200" class="line dash"/>
<rect x="440" y="500" width="600" height="196" class="zone"/><text x="460" y="524" class="tag">WORKLOAD / STORAGE</text><rect x="488" y="564" width="304" height="72" rx="4" class="node"/><text x="640" y="594" class="n" font-size="18" font-weight="600" text-anchor="middle">MoniKey</text><text x="640" y="616" class="m" font-size="12" text-anchor="middle">WEB · API · WORKER · POSTGRESQL</text><rect x="848" y="564" width="152" height="72" rx="4" class="petrol"/><text x="924" y="594" class="n" font-size="16" font-weight="600" text-anchor="middle">Longhorn</text><text x="924" y="616" class="m" font-size="12" text-anchor="middle">PVC</text><path d="M1104 452V480H640V564" class="line"/><path d="M792 600H848" class="line"/>
<rect x="1072" y="500" width="360" height="196" class="zone"/><text x="1092" y="524" class="tag">OBSERVABILITY</text><rect x="1104" y="556" width="296" height="56" rx="4" class="petrol"/><text x="1252" y="582" class="n" font-size="15" font-weight="600" text-anchor="middle">Prometheus · Loki · Alloy</text><text x="1252" y="600" class="m" font-size="11" text-anchor="middle">METRICS + LOGS</text><rect x="1160" y="636" width="184" height="44" rx="4" class="node"/><text x="1252" y="664" class="n" font-size="16" font-weight="600" text-anchor="middle">Grafana</text><path d="M792 580H816V536H1048V584H1104" class="line dash"/><path d="M1252 612V636" class="line"/>
<line x1="64" y1="840" x2="1536" y2="840" stroke="#bbb5aa"/><text x="64" y="868" class="m" font-size="12">PRIMARY PATH · DNS → LOAD BALANCER → INGRESS → WORKLOAD</text><text x="1536" y="868" class="m" font-size="12" text-anchor="end">PROXMOX / VM / K3S BOUNDARIES</text></svg>
