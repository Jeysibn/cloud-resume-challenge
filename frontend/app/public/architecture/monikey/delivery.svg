<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="monikey-delivery-title monikey-delivery-desc">
<title id="monikey-delivery-title">MoniKey durable processing and delivery boundary</title><desc id="monikey-delivery-desc">Focused view of the PostgreSQL-backed worker lifecycle from a worker tick through a locked job claim and processor outcomes, alongside the repository image publication handoff to external GitOps deployment configuration.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz@6..96&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Manrope:wght@400;600&amp;display=swap');.t{font-family:'Bodoni Moda',serif;fill:#171912}.n{font-family:Manrope,sans-serif;fill:#171912}.m{font-family:'IBM Plex Mono',monospace;fill:#5f625b}.zone{fill:none;stroke:#9b978d}.node{fill:#f8f4eb;stroke:#171912;stroke-width:1.5}.petrol{fill:#d4dfd9;stroke:#275d57;stroke-width:1.5}.focal{fill:#171912;stroke:#e0522d;stroke-width:2}.handoff{fill:#f1cfc2;stroke:#e0522d;stroke-width:1.5;stroke-dasharray:7 5}.line{fill:none;stroke:#66695f;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:8 8}.tag{font:500 12px 'IBM Plex Mono';fill:#275d57;letter-spacing:2px}.label{font:500 12px 'IBM Plex Mono';fill:#5f625b}.white{fill:#eee9de}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#66695f"/></marker></defs>
<rect width="1600" height="900" fill="#eee9de"/><text x="64" y="68" class="tag">SYSTEM 03 · PROCESSING / DELIVERY</text><text x="64" y="126" class="t" font-size="48">Durable work, explicit handoff</text><text x="1536" y="68" class="m" font-size="12" text-anchor="end">STATE + DELIVERY VIEW</text><line x1="64" y1="156" x2="1536" y2="156" stroke="#bbb5aa"/>
<rect x="64" y="196" width="1472" height="252" class="zone"/><text x="88" y="224" class="tag">POSTGRESQL-BACKED WORKER</text><rect x="112" y="302" width="220" height="68" rx="4" class="node"/><text x="222" y="333" class="n" font-size="18" font-weight="600" text-anchor="middle">Worker tick</text><text x="222" y="355" class="m" font-size="12" text-anchor="middle">DUE MAINTENANCE</text><rect x="412" y="302" width="220" height="68" rx="4" class="petrol"/><text x="522" y="333" class="n" font-size="18" font-weight="600" text-anchor="middle">worker_jobs</text><text x="522" y="355" class="m" font-size="12" text-anchor="middle">POSTGRESQL ROWS</text><rect x="712" y="302" width="220" height="68" rx="4" class="focal"/><text x="822" y="333" class="n white" font-size="17" font-weight="600" text-anchor="middle">Claim due job</text><text x="822" y="355" class="m white" font-size="12" text-anchor="middle">FOR UPDATE SKIP LOCKED</text><rect x="1012" y="302" width="220" height="68" rx="4" class="node"/><text x="1122" y="333" class="n" font-size="18" font-weight="600" text-anchor="middle">Processor</text><text x="1122" y="355" class="m" font-size="12" text-anchor="middle">RECURRING / NOTICE / SNAPSHOT</text><path d="M332 336H412" class="line"/><path d="M632 336H712" class="line"/><path d="M932 336H1012" class="line"/><rect x="1012" y="396" width="220" height="34" class="petrol"/><text x="1122" y="419" class="m" font-size="11" text-anchor="middle">success · retry · dead</text><path d="M1122 370V396" class="line"/>
<rect x="64" y="488" width="1472" height="288" class="zone"/><text x="88" y="516" class="tag">REPOSITORY → DEPLOYMENT OWNER</text><rect x="120" y="602" width="224" height="68" rx="4" class="node"/><text x="232" y="633" class="n" font-size="18" font-weight="600" text-anchor="middle">MoniKey main</text><text x="232" y="655" class="m" font-size="12" text-anchor="middle">SOURCE + MIGRATIONS</text><rect x="424" y="602" width="224" height="68" rx="4" class="petrol"/><text x="536" y="633" class="n" font-size="18" font-weight="600" text-anchor="middle">GitHub Actions</text><text x="536" y="655" class="m" font-size="12" text-anchor="middle">BUILD + VALIDATE</text><rect x="728" y="602" width="224" height="68" rx="4" class="focal"/><text x="840" y="633" class="n white" font-size="18" font-weight="600" text-anchor="middle">GHCR images</text><text x="840" y="655" class="m white" font-size="12" text-anchor="middle">API · WEB · MIGRATION</text><rect x="1032" y="602" width="332" height="68" rx="4" class="handoff"/><text x="1198" y="633" class="n" font-size="17" font-weight="600" text-anchor="middle">homelab-gitops</text><text x="1198" y="655" class="m" font-size="12" text-anchor="middle">MANIFESTS · ROLLOUT · BACKUPS</text><path d="M344 636H424" class="line"/><path d="M648 636H728" class="line"/><path d="M952 636H1032" class="line dash"/><text x="992" y="618" class="label" text-anchor="middle">HANDOFF</text><text x="1398" y="632" class="m" font-size="11">CURRENT FOLLOW-UP:</text><text x="1398" y="652" class="m" font-size="11">DIGESTS · TLS · BACKUPS</text><line x1="64" y1="824" x2="1536" y2="824" stroke="#bbb5aa"/><text x="64" y="854" class="m" font-size="12">PRIMARY PATH · WORKER TICK → DURABLE JOB → EXPLICIT OUTCOME</text><text x="1536" y="854" class="m" font-size="12" text-anchor="end">NO MESSAGE BROKER IN WORKER SCHEDULER</text></svg>
