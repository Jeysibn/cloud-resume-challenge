<rect x="1080" y="382" width="456" height="394" class="zone"/><text x="1104" y="410" class="tag">OPTIONAL ADAPTER BOUNDARY</text><rect x="1144" y="458" width="328" height="82" rx="4" class="ext"/><text x="1308" y="492" class="n" font-size="18" font-weight="600" text-anchor="middle">Provider adapters</text><text x="1308" y="516" class="m" font-size="12" text-anchor="middle">FX · QUOTES · OCR · AI · IMPORTS</text><path d="M744 480H1144" class="line dash"/><text x="944" y="464" class="label" text-anchor="middle">CONFIGURED INTEGRATIONS</text><rect x="1168" y="624" width="280" height="58" rx="4" class="node"/><text x="1308" y="658" class="n" font-size="16" font-weight="600" text-anchor="middle">Object storage / email</text><path d="M880 516V580H1308V624" class="line dash"/>
