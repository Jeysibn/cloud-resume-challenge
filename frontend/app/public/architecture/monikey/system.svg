<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="monikey-system-title monikey-system-desc">
<title id="monikey-system-title">MoniKey application runtime architecture</title><desc id="monikey-system-desc">Runtime view of MoniKey from the browser and nginx-served React frontend through the Fastify API to PostgreSQL, with a separate worker sharing the database and optional provider adapters at the API boundary.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz@6..96&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Manrope:wght@400;600&amp;display=swap');.t{font-family:'Bodoni Moda',serif;fill:#171912}.n{font-family:Manrope,sans-serif;fill:#171912}.m{font-family:'IBM Plex Mono',monospace;fill:#5f625b}.zone{fill:none;stroke:#9b978d;stroke-width:1}.node{fill:#f8f4eb;stroke:#171912;stroke-width:1.5}.petrol{fill:#d4dfd9;stroke:#275d57;stroke-width:1.5}.focal{fill:#171912;stroke:#e0522d;stroke-width:2}.ext{fill:#f1cfc2;stroke:#e0522d;stroke-width:1.5;stroke-dasharray:7 5}.line{fill:none;stroke:#66695f;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:8 8}.tag{font:500 12px 'IBM Plex Mono';fill:#275d57;letter-spacing:2px}.label{font:500 12px 'IBM Plex Mono';fill:#5f625b}.white{fill:#eee9de}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#66695f"/></marker></defs>
<rect width="1600" height="900" fill="#eee9de"/><text x="64" y="68" class="tag">SYSTEM 03 · RUNTIME</text><text x="64" y="126" class="t" font-size="48">MoniKey application runtime</text><text x="1536" y="68" class="m" font-size="12" text-anchor="end">CONTAINER VIEW</text><line x1="64" y1="156" x2="1536" y2="156" stroke="#bbb5aa"/>
<rect x="64" y="196" width="1472" height="146" class="zone"/><text x="88" y="224" class="tag">CLIENT / EDGE</text><rect x="144" y="254" width="250" height="62" rx="4" class="node"/><text x="269" y="281" class="n" font-size="18" font-weight="600" text-anchor="middle">Browser</text><text x="269" y="302" class="m" font-size="12" text-anchor="middle">FINANCE USER</text><rect x="640" y="242" width="360" height="86" rx="4" class="petrol"/><text x="820" y="278" class="n" font-size="20" font-weight="600" text-anchor="middle">nginx / React</text><text x="820" y="304" class="m" font-size="12" text-anchor="middle">VITE · STATIC FRONTEND</text><path d="M394 285H640" class="line"/><text x="517" y="269" class="label" text-anchor="middle">HTTPS</text>
<rect x="64" y="382" width="960" height="164" class="zone"/><text x="88" y="410" class="tag">APPLICATION PROCESS</text><rect x="344" y="444" width="400" height="72" rx="4" class="focal"/><text x="544" y="476" class="n white" font-size="20" font-weight="600" text-anchor="middle">Fastify API</text><text x="544" y="498" class="m white" font-size="12" text-anchor="middle">NODE.JS · AUTH · FINANCE MODULES</text><path d="M820 328V444" class="line"/><text x="840" y="388" class="label">/api/v1</text><rect x="784" y="444" width="192" height="72" rx="4" class="petrol"/><text x="880" y="476" class="n" font-size="16" font-weight="600" text-anchor="middle">Worker</text><text x="880" y="498" class="m" font-size="12" text-anchor="middle">MAINTENANCE LOOP</text>
