<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">Runtime architecture</title>
  <desc id="architecture-desc">CloudFront serves the React site from private Amazon S3 using Origin Access Control. The browser calls the API Gateway HTTP API, invoking Python Lambda to read or increment the DynamoDB counter. CloudWatch stores Lambda logs.</desc>
  <defs>
    <style>
      .title{font:600 51px system-ui, sans-serif;fill:#171912}
      .sub{font:600 18px system-ui, sans-serif;fill:#275D57;letter-spacing:3px}
      .name{font:600 24px system-ui, sans-serif;fill:#171912}
      .detail{font:400 17px system-ui, sans-serif;fill:#5F625B}
      .tag{font:600 15px system-ui,sans-serif;fill:#275D57;letter-spacing:1.5px}
      .note{font:400 18px system-ui,sans-serif;fill:#5F625B}
      .edge{fill:none;stroke:#5F625B;stroke-width:3;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5F625B"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#EEE9DE"/>
  <text x="80" y="84" class="sub">AWS CLOUD RESUME CHALLENGE · VERSION 2</text>
  <text x="80" y="157" class="title">Runtime architecture</text>
  <line x1="80" y1="190" x2="1520" y2="190" stroke="#B8B2A6" stroke-width="2"/>
  
<rect x="80" y="224" width="1440" height="185" rx="8" fill="none" stroke="#B8B2A6" stroke-width="2"/>
<text x="100" y="253" class="tag">STATIC SITE DELIVERY · HTTPS</text>
