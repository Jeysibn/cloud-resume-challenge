<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="portfolio-delivery-title portfolio-delivery-desc">
<title id="portfolio-delivery-title">Cloud-backed portfolio delivery architecture</title><desc id="portfolio-delivery-desc">Phased deployment view showing canonical content validation and knowledge projection alongside frontend, backend, and Terraform delivery paths and their production targets.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz@6..96&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Manrope:wght@400;600&amp;display=swap');.t{font-family:'Bodoni Moda',serif;fill:#171912}.n{font-family:Manrope,sans-serif;fill:#171912}.m{font-family:'IBM Plex Mono',monospace;fill:#5f625b}.zone{fill:none;stroke:#9b978d}.node{fill:#f5f1e8;stroke:#171912;stroke-width:1.5}.soft{fill:#ded8ca;stroke:#6f7169}.petrol{fill:#d4dfd9;stroke:#275d57;stroke-width:1.5}.focal{fill:#171912;stroke:#e0522d;stroke-width:2}.line{fill:none;stroke:#66695f;stroke-width:2;marker-end:url(#a)}.dash{stroke-dasharray:8 8}.tag{font:500 12px 'IBM Plex Mono';fill:#275d57;letter-spacing:2px}.label{font:500 12px 'IBM Plex Mono';fill:#5f625b}.white{fill:#eee9de}</style><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#66695f"/></marker></defs>
<rect width="1600" height="900" fill="#eee9de"/><text x="64" y="68" class="tag">SYSTEM 01 · DELIVERY</text><text x="64" y="126" class="t" font-size="48">Three paths to production</text><text x="1536" y="68" class="m" font-size="12" text-anchor="end">DEPLOYMENT / CONTROL-PLANE VIEW</text><line x1="64" y1="156" x2="1536" y2="156" stroke="#bbb5aa"/>
