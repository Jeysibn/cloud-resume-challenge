<rect x="64" y="196" width="1472" height="128" class="zone"/><text x="88" y="224" class="tag">OPERATOR / WEB</text><rect x="132" y="252" width="244" height="48" rx="4" class="node"/><text x="254" y="282" class="n" font-size="17" font-weight="600" text-anchor="middle">Operator</text><rect x="540" y="240" width="360" height="72" rx="4" class="petrol"/><text x="720" y="270" class="n" font-size="19" font-weight="600" text-anchor="middle">React web</text><text x="720" y="292" class="m" font-size="12" text-anchor="middle">VITE · TYPESCRIPT · TAILWIND</text><path d="M376 276H540" class="line"/><text x="458" y="260" class="label" text-anchor="middle">HTTPS</text>
